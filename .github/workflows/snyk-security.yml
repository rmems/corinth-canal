# Security audit workflow — RustSec only.
# Snyk is via the Snyk GitHub App PR check ("code/snyk") and on-demand MCP
# tools (AGENTS.md GH#108). Do not re-add Snyk CLI jobs here.
name: Security Audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  # rustsec/audit-check posts a check run via the Checks API.
  checks: write

jobs:
  rustsec:
    name: RustSec Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
