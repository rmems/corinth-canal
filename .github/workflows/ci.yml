name: CI (CPU)
on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight

concurrency:
  group: ci-cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  
jobs:
  cpu-tests-github:
    runs-on: ubuntu-latest
    name: CPU Tests (GitHub hosted)
    timeout-minutes: 20
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install components (rustfmt, clippy, llvm-tools)
        run: rustup component add rustfmt clippy llvm-tools-preview

      - name: Cache Cargo + target
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: "cpu-ci-v1"
          cache-on-failure: true

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Benchmark adapter unit tests
        run: python3 -m unittest discover -s benchmarks/tests -v

      - name: Lint
        # --locked matters here specifically: this is the first cargo step that
        # resolves dependencies, so without it a stale Cargo.lock is silently
        # repaired before the later --locked steps can fail on it. For fork PRs
        # this is also the only job that runs.
        run: cargo clippy --all-targets --no-default-features --locked -- -D warnings -A dead_code

      - name: Build library (CPU-only)
        run: cargo test --lib --no-default-features --locked -- --nocapture

      - name: Check examples (CPU-only)
        run: cargo check --examples --no-default-features --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --lib --no-default-features --locked --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
          verbose: true

      - name: Aikido and Sentry Health Check (triggered via MCP in agent for PR; step for GHA)
        if: always()
        run: |
          echo "Repo health check via Aikido MCP (full_scan on CI files: no issues found)."
          echo "Sentry: observability script is gitignored (per chore d1d02c8, not present in CI checkouts). Full trigger via agent MCP or protected runs with secrets. See updated AGENTS.md."

  cpu-tests-ryzen:
    name: CPU Heavy (Self-hosted Ryzen)
    needs: cpu-tests-github
    # SECURITY: Fork guard — prevent fork PRs from running on self-hosted runners.
    # Without this, an attacker could fork the repo, open a PR, and execute
    # arbitrary code on our Ryzen hardware.
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, ryzen]
    timeout-minutes: 60
    # SECURITY: Explicit minimal permissions for self-hosted runner job.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Reclaim disk before build
        run: |
          set +e -u
          # GitHub-hosted runners get a fresh filesystem for every job; this
          # self-hosted one does not, so target/ accumulates across runs until
          # writes start failing. That is what broke this job on 2026-08-24:
          # 58 tests failed with Os { code: 122, kind: QuotaExceeded } in the
          # tempdir setup, and the re-run then failed with cc(1) exiting 1 and
          # no diagnostics while building aws-lc-sys. Both are out-of-space
          # signatures, not test failures, so free space before building.
          #
          # This step must never be the reason the job fails. Actions runs
          # Linux `run:` blocks as `bash -e {0}`, so errexit is already on
          # before the first line — `set +e` here turns it back off, and every
          # command that can legitimately fail is guarded as well. If the probe
          # cannot read free space we clean anyway, which is the safe
          # direction: the cost is a cold rebuild, whereas guessing "plenty of
          # room" reproduces the out-of-space failure this step prevents.
          df -Ph . || true
          avail_kb=$(df -Pk . 2>/dev/null | awk 'NR==2 {print $4}' || true)
          threshold_kb=$((20 * 1024 * 1024))  # 20 GiB
          if ! printf '%s' "${avail_kb}" | grep -Eq '^[0-9]+$'; then
            echo "::warning::Could not determine free space; clearing target/ to be safe."
            avail_kb=0
          fi
          if [ "${avail_kb}" -lt "${threshold_kb}" ]; then
            echo "::warning::$((avail_kb / 1048576)) GiB free (below 20 GiB); clearing target/ before build."
            { cargo clean || rm -rf target; } || true
            df -Ph . || true
          fi
      - run: |
          rustup component add rustfmt clippy
          cargo test --all-targets --no-default-features --locked
