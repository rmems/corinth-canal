name: Docker Build (CUDA 13.2)
on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# SECURITY: Restrict default token permissions to read-only at workflow level.
# The build job escalates to packages:write only for main-push publish steps.
permissions:
  contents: read

jobs:
  build:
    name: Build Docker Image
    permissions:
      contents: read
      packages: write
    # SECURITY: Fork guard — prevent fork PRs from running on self-hosted runners.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, cuda-13.2, sm_120, gpu]
    env:
      CUDAHOSTCXX: /usr/bin/clang++

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Set Docker tags
        id: tags
        run: |
          TAGS="ghcr.io/${{ github.repository }}:${{ github.sha }}"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="$TAGS,ghcr.io/${{ github.repository }}:main"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAGS="$TAGS,ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry (only on main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            CUDA_VERSION=13.2.0
            RUST_VERSION=stable
            CUDAHOSTCXX=/usr/bin/clang++
          cache-from: type=gha
          cache-to: type=gha,mode=max
