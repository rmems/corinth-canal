# Every GitHub Action in this repository is pinned to a full commit SHA, which
# is the right call for supply-chain safety but means nothing ever updates them
# without a bot. Same for the cargo graph.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      # Keep the opentelemetry crates moving together; they must share a version.
      opentelemetry:
        patterns:
          - "opentelemetry*"


  # NOTE: no pip entry yet. `benchmarks/` has no dependency manifest on main —
  # pyproject.toml arrives with GH#182 / #183. Dependabot errors on an
  # ecosystem with no manifest to read, so the pip block is deliberately
  # omitted until that lands, then added in a follow-up.
