# corinth-canal local GGUF lineup template (SAAQ 1.0 / 1.5).
#
# Copy this file to `configs/local_gguf_lineup.toml` and replace the
# placeholder paths with your local GGUF checkpoint locations.
# `configs/local_gguf_lineup.toml` is gitignored — paths never leave your
# machine. Per AGENTS.md, local absolute paths must not be committed.
#
# Point LINEUP_CONFIG at your copy:
#   LINEUP_CONFIG=configs/local_gguf_lineup.toml
#
# LINEUP_CONFIG is a hard error when set but unreadable, so leave it unset
# rather than naming a file you have not created yet.
#
# Fields:
#   slug    directory-safe identifier (used in artifact paths)
#   family  family slug; must match a ModelFamily alias (see src/types.rs)
#   path    absolute or relative path to the .gguf checkpoint. `~` is NOT
#           expanded: the loader calls Path::exists on the string as written,
#           so a `~/...` entry is reported "file not found" and skipped.
#
# Only MoE checkpoints belong here. Dense models have no expert_count and
# are not valid SAAQ campaign targets.

[[model]]
slug = "olmoe_1b_7b_f16"
family = "olmoe"
path = "/absolute/path/to/olmoe-0125-gguf/OLMoE-1B-7B-0125-Instruct-F16.gguf"

