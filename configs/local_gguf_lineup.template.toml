# Template for the local-only SAAQ 1.0 / 1.5 GGUF lineup.
#
# Copy to configs/local_gguf_lineup.toml (gitignored) and replace every
# /absolute/path/to/... placeholder with a real path on your machine.
# Never commit the copy — it carries machine-specific absolute paths.
#
# Update paths to match your local GGUF model locations.

# ── Models under ~/.models/gguf/ ──

[[model]]
slug = "zaya1_8b_q8_0"
family = "zaya"
path = "/absolute/path/to/ZAYA1-8B-Q8_0.gguf"

