family = "glm4"
cloud_model_id = "zai-org/GLM-4.7-Flash"
source_url = "https://huggingface.co/zai-org/GLM-4.7-Flash"
target = "cloud"
architecture = "moe"
active_params = "3B"
total_params = "30B"
provider_format = "safetensors"

