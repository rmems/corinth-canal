# corinth-canal SAAQ 1.5 cloud model lineup.
#
# Parsed by load_cloud_lineup in examples/support/lineup.rs. This file is cloud
# metadata scaffolding. Each [[model]] entry is a cloud metadata stub —
# corinth-canal does not create, provision, or tear down cloud resources.
#
# Cloud execution is delegated to Dioscuri-Cloud. This file records
# metadata for fail-fast validation.
#
# Wire-up note: when CLOUD_LINEUP_CONFIG names this file, RunConfig::from_env
# (examples/support/config.rs) parses it with load_cloud_lineup and runs
# cloud_execution_guard on every entry, aborting the run on any failure. Entries
# are validated only and are not added to the run set, and no shipped entry
# declares required_env_vars, so the guard passes all of them. This file remains
# a documented inventory, not a model source.
#
# Fields:
#   slug                directory-safe identifier (used in artifact paths)
#   family              optional model family for routing tensor selection
#                       one of: olmoe | qwen3_moe | gemma4 | deepseek2 | llama_moe | zaya | glm4
#                       | nemotron | lfm2_moe | slim_moe | granite_3_1_a800m | moonlight_16b_a3b
#                       | gpt_oss | step | minimax | cohere | grin | skyworks | trinity | grok
#                       leave blank when no existing corinth-canal family matches
#   cloud_model_id      provider-qualified model identifier (passed to Dioscuri-Cloud)
#   source_url          canonical model card or provider listing
#   target              execution target: "cloud"
#   architecture        model class: "moe" | "dense"
#   active_params       known active parameter count (informational)
#   total_params        total parameter count including shared weights (informational)
#   provider_format     expected runtime format on the cloud side
#
# Note: Cloud models are downloaded on GPU; no API keys or env vars required.
#
# Campaign settings (SAAQ_RULE, TELEMETRY_SOURCE, REPEAT_COUNT, RUN_TAG) are read
# from the environment by the runner (examples/support/); this file carries no
# per-entry overrides, and any extra key fails to parse (deny_unknown_fields).
# The runner default for REPEAT_COUNT is 1; `just saaq-campaign` sets 2.
#
# No Terraform, no cloud credentials, no provider SDK code.

# ── zai-org/GLM-4.7-Flash (MoE, 30B total / 3B active) ──
