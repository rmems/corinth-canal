# corinth-canal model adapter configurations.
#
# Reference metadata only: no code in this repository loads this file.
# RunMatrix (src/experiment/schema.rs) deserializes [[run]] entries and nothing
# else, so editing these policies changes no validation behaviour. Each
# [[adapter]] entry documents the intended policies for one model family.
#
# Fields:
#   model_family              family slug (must match ModelFamily::slug())
#   model_id_or_local_path    canonical HF model ID or local path pattern
#   format                    checkpoint format: "gguf" | "safetensors" | "custom_artifact"
#   loader_hint               loader backend hint: "gguf" | "safetensors" | "vllm" | "sglang"
#   router_policy             how to handle router tensors: "protect" | "quantize" | "drop"
#   norm_policy               how to handle norm tensors: "protect" | "quantize" | "drop"
#   expert_policy             how to handle expert tensors: "protect" | "quantize" | "drop"
#   supports_route_metrics    whether the family supports per-route metrics
#   supports_block_metrics    whether the family supports per-block metrics
#   preferred_quant_modes     list of preferred quantization modes
#   minimum_expected_artifacts  list of artifacts every run must produce
#   known_risks               list of known risks or caveats

# ── OLMoE family ──
[[adapter]]
model_family = "olmoe"
model_id_or_local_path = "allenai/OLMoE-1B-7B-0125-Instruct"
format = "safetensors"
loader_hint = "safetensors"
router_policy = "protect"
norm_policy = "protect"
expert_policy = "quantize"
supports_route_metrics = true
supports_block_metrics = true
preferred_quant_modes = ["q8_0", "q6_k", "q5_k"]
minimum_expected_artifacts = ["manifest.json", "summary.json", "metrics.json"]
known_risks = ["Small model: may show high variance across runs"]

