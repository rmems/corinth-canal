# corinth-canal SAAQ run matrix for Vultr sprint 2026-05-28.
#
# This file defines the bounded multi-model experiment matrix.
# Each [[run]] entry references a model family defined in
# `configs/model_adapter_configs.toml`.
#
# Validation:
#   cargo run --example validate_matrix -- experiments/vultr-2026-05-28/matrix.toml
#
# Fields:
#   run_id              unique run identifier
#   model_family        family slug (must match ModelFamily::slug())
#   model_id_or_path    HF model ID or local path
#   source_format       "gguf" | "safetensors" | "custom_artifact"
#   quant_mode          quantization mode string
#   saaq_formula_version  e.g. "saaq_v1_5"
#   router_policy       "protect" | "quantize" | "drop"
#   norm_policy         "protect" | "quantize" | "drop"
#   telemetry_source    "synthetic" | "csv"
#   output_root         artifact output directory
#   max_runtime_minutes declared runtime budget; must be non-zero for an
#                       enabled run. NOT enforced: no runner loads this file,
#                       so nothing kills a run that exceeds it.
#   max_disk_gib        declared disk budget; same caveat, not enforced
#   expected_artifacts  files the operator expects to find afterwards
#                       (reviewed by hand, not checked by code)
#   success_metrics     post-hoc review criteria (not evaluated by code)
#   skip_reason         if set, the run is a documented skip and validation
#                       bypasses every check for it
#
# This matrix is a plan for the operator; saaq_latent_calibration is driven
# by env / lineup config and never reads it. Keep it validating on a clean
# checkout: the grok-1 entry carries a skip_reason because validation gates
# grok-1 on GROK1_ARTIFACT_READY=1. To enable it, remove the skip_reason and
# export GROK1_ARTIFACT_READY=1.

# ── Local baseline runs ──

[[run]]
run_id = "olmoe_baseline_q8_0"
model_family = "olmoe"
model_id_or_path = "allenai/OLMoE-1B-7B-0125-Instruct"
source_format = "safetensors"
quant_mode = "q8_0"
saaq_formula_version = "saaq_v1_5"
router_policy = "protect"
norm_policy = "protect"
telemetry_source = "synthetic"
output_root = "runs/olmoe_baseline_q8_0"
max_runtime_minutes = 30
max_disk_gib = 10
expected_artifacts = ["run_manifest.json", "summary.json", "tick_telemetry.txt", "latent_telemetry.csv"]
success_metrics = ["ticks_completed > 0", "latent_rows > 0"]

